aid: deep-yellow

name: Deep Yellow

description: 'Deep Yellow Limited is an Australian uranium company listed on the ASX (DYL), with secondary listings on the
  Namibian Stock Exchange (NSX: DYL) and OTC Markets (DYLLF), describing its aim as becoming a tier-one, low-cost uranium
  producer. Its portfolio includes the Tumas and Omahola projects and the Nova and Yellow Dune joint ventures in Namibia,
  plus the Mulga Rock project in Western Australia and the Alligator River project and Cooper Creek JV in the Northern Territory.
  Its site (deepyellow.com.au) is a corporate and investor-relations site; no public developer portal, API documentation or
  API product was found on it. The company was surfaced via the API Evangelist harvest backlog (australia-apidays-2026).'

